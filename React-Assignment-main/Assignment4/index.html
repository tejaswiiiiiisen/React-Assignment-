<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>A4 - Tejaswi Sen</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 sm:p-6 antialiased">

    <!-- Card Container -->
    <div class="w-full max-w-xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden transition-all duration-300 hover:shadow-2xl">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 py-6 px-6 text-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-wide">
                Welcome to Tailwind CSS
            </h1>
        </div>

        <!-- Body Content -->
        <div class="p-6 sm:p-8 text-center space-y-5">

            <h2 class="text-xl sm:text-2xl font-bold text-slate-800">
                Hey There! I'm <span class="text-blue-600">Tejaswi Sen</span>.
            </h2>

            <p class="text-slate-600 text-base leading-relaxed">
                I'm pursuing my BCA degree at <span class="font-semibold text-slate-700">Dezyne E'cole College</span>.
            </p>

            <!-- Form -->
            <form class="mt-6 space-y-4 max-w-md mx-auto" onsubmit="event.preventDefault();">
                <input
                    type="text"
                    placeholder="Enter Your Name"
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:bg-white transition duration-200"
                >

                <button
                    type="submit"
                    class="w-full py-3 px-6 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 active:scale-[0.99] shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer"
                >
                    Submit
                </button>
            </form>

            <p class="mt-6 text-sm text-slate-500 italic">
                "Thank you for visiting my Tailwind assignment page!"
            </p>

        </div>
    </div>

</body>
</html>
