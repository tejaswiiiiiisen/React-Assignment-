
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>A4</title>
</head>

<body>

    <div class="max-w-2xl mx-auto my-10 text-center shadow-lg rounded">

        <div class="bg-[#393E41] py-4 rounded-t-lg">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-mono font-bold text-[#D3D0CB] tracking-wide">
                Welcome to Tailwind CSS
            </h1>
        </div>

        <div class="p-6 sm:p-8">

            <h2 class="text-xl sm:text-2xl md:text-3xl font-mono font-semibold text-[#393E41]">
                Hey There! I'm Tanvi Chouhan.
            </h2>

            <p class="mt-4 font-mono text-[#393E41] leading-7">
                I'm pursuing my BCA degree at Dezyne E'cole College.
            </p>

            <form class="mt-8 space-y-4 font-mono">

                <input
                    type="text"
                    placeholder="Enter Your Name"
                    class="w-full p-3 font-mono rounded-lg border border-[#D3D0CB] bg-[#F5F4F2] focus:outline-none focus:ring-2 focus:ring-[#393E41] transition"
                >

                <button
                    class="w-full font-mono bg-[#393E41] hover:bg-[#D3D0CB] hover:text-[#393E41] text-white p-3 rounded-lg font-semibold shadow-md transition duration-500"
                >
                    Submit
                </button>

            </form>

            <p class="mt-6 text-[#393E41] font-mono">
                "Thankyou for visiting my Tailwind assignment page!"
            </p>

        </div>
    </div>

</body>
</html>
